# Build + test on every push / PR, for Windows and Linux.
# - Push to main: publishes a pre-release dev build (v<next>-dev.<commits>) for the Pre-release
#   update channel, keeping the newest few.
# - Push a tag like v0.2.0: publishes a release (a pre-release if the version has a suffix).
# Releases carry the packages (Windows setup + zip, Linux AppImage + tarball), their SHA-256
# files and patch notes from the commits since the previous tag.
name: Build

on:
  push:
    branches: [main]
    # Version tags only (v1.2.3): not other tags like vfg-runtime (the frame generation runtime).
    tags: ["v[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # How many dev pre-releases to keep (older ones and their tags are deleted).
  KEEP_DEV_BUILDS: 5
  # Baked into the binary (option_env!) so the in-app updater knows where to look.
  PASSTHRIFY_REPO: ${{ github.repository }}

jobs:
  # kind: release (tag push), dev (main) or none (PRs, other branches).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      kind: ${{ steps.version.outputs.kind }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the dev build number

      - name: Resolve version
        id: version
        env:
          IS_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          $kind = 'none'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $kind = 'release'
            if ($env:GITHUB_REF_NAME -ne "v$ver") {
              throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $ver - bump Cargo.toml first."
            }
          } elseif ($env:IS_MAIN -eq 'true') {
            $kind = 'dev'
            # N = commit count on main: rises with every commit and maps a build back to it.
            $n = (git rev-list --count HEAD).Trim()
            # A dev build must sort above the last release and below the next one.
            if ($ver -match '-') {
              $ver = "$ver.dev.$n"                          # 0.2.0-beta.1 -> 0.2.0-beta.1.dev.N
            } elseif (git tag -l "v$ver") {
              $p = $ver.Split('.')                          # 0.1.0 released -> 0.1.1-dev.N
              $ver = "$($p[0]).$($p[1]).$([int]$p[2] + 1)-dev.$n"
            } else {
              $ver = "$ver-dev.$n"                          # 0.2.0 unreleased -> 0.2.0-dev.N
            }
          }
          Write-Host "Version $ver ($kind)"
          "version=$ver" >> $env:GITHUB_OUTPUT
          "kind=$kind" >> $env:GITHUB_OUTPUT

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # build.ps1 downloads FFmpeg 8.1 (LGPL shared) into third_party/ffmpeg when missing.
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-n8.1-lgpl-shared-${{ hashFiles('build.ps1') }}

      # Dev builds: stamp the version into Cargo.toml so the exe reports it and build.ps1 names
      # the packages after it.
      - name: Stamp version
        run: |
          $toml = Get-Content Cargo.toml -Raw
          $toml = ([regex]'(?m)^version\s*=\s*"[^"]+"').Replace($toml, "version = `"$env:VERSION`"", 1)
          Set-Content Cargo.toml $toml -NoNewline -Encoding utf8NoBOM

      # The runner image normally ships Inno Setup 6; install it if this one doesn't.
      - name: Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }

      # Prerequisite checks, tests, release build, dist\Passthrify + the zip + the setup exe
      - name: Test, build and package
        run: ./build.ps1 -Zip -Installer

      - name: Checksum
        run: |
          foreach ($file in "dist/Passthrify-$env:VERSION.zip", "dist/Passthrify-$env:VERSION-setup.exe") {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $file -Leaf)" | Out-File -Encoding ascii "$file.sha256"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Passthrify-${{ env.VERSION }}-windows-${{ github.sha }}
          path: |
            dist/Passthrify-${{ env.VERSION }}.zip
            dist/Passthrify-${{ env.VERSION }}.zip.sha256
            dist/Passthrify-${{ env.VERSION }}-setup.exe
            dist/Passthrify-${{ env.VERSION }}-setup.exe.sha256
          if-no-files-found: error

  linux:
    needs: version
    # The oldest supported runner: the binary needs this glibc (2.39) or newer, and PipeWire
    # 0.3.49+ (22.04 has 0.3.48).
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev libclang-dev clang pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # build.sh downloads FFmpeg 8.1 (LGPL shared) into third_party/ffmpeg-linux when missing.
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg-linux
          key: ffmpeg-n8.1-lgpl-shared-linux-${{ hashFiles('build.sh') }}

      - name: Stamp version
        run: sed -i "0,/^version *= *\".*\"/s//version = \"$VERSION\"/" Cargo.toml

      # Prerequisite checks, tests, release build, dist/Passthrify + the tarball + the AppImage
      # (each with its .sha256).
      - name: Test, build and package
        run: ./build.sh --tarball --appimage

      - uses: actions/upload-artifact@v4
        with:
          name: Passthrify-${{ env.VERSION }}-linux-${{ github.sha }}
          path: |
            dist/Passthrify-${{ env.VERSION }}-linux-x86_64.tar.gz
            dist/Passthrify-${{ env.VERSION }}-linux-x86_64.tar.gz.sha256
            dist/Passthrify-${{ env.VERSION }}-x86_64.AppImage
            dist/Passthrify-${{ env.VERSION }}-x86_64.AppImage.sha256
          if-no-files-found: error

  # The flake package (`nix build` / `nix run`) keeps building. Not needed for publishing.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: nix build
        run: nix build -L --print-out-paths

  # ---- Release (tag pushes and main) --------------------------------------------------------

  publish:
    needs: [version, windows, linux]
    if: needs.version.outputs.kind != 'none'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KIND: ${{ needs.version.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the patch notes

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Patch notes
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          $tag = "v$env:VERSION"
          if ($env:KIND -eq 'release') {
            # Release notes cover everything since the previous real release, not the last dev build.
            $prev = git describe --tags --abbrev=0 --exclude '*-dev.*' "$tag^" 2>$null
            $head = $tag
          } else {
            $prev = git describe --tags --abbrev=0 --exclude $tag HEAD 2>$null
            $head = 'HEAD'
          }
          if ($LASTEXITCODE -ne 0) { $prev = $null } # no earlier tag
          $range = if ($prev) { "$prev..$head" } else { $head }
          $since = if ($prev) { "since $prev" } else { "(first release)" }

          # One bullet per commit subject; merge commits and release-bump commits are skipped.
          $changes = git -c i18n.logOutputEncoding=utf-8 log $range --no-merges --reverse --pretty=format:'%s' |
            Where-Object { $_ -and $_ -notmatch '^(Release|Bump version)\b' } |
            ForEach-Object { "- $_" }
          if (-not $changes) { $changes = @('- Maintenance release.') }

          $v = $env:VERSION
          $notes = @("## Passthrify $tag", "")
          if ($env:KIND -eq 'dev') {
            $notes += "Automatic pre-release build of ``$($env:GITHUB_SHA.Substring(0, 7))`` on main."
            $notes += "Less tested than stable releases; offered on the **Pre-release** update channel."
            $notes += ""
          }
          $notes += @(
            "### Changes $since"
            $changes
            ""
            "### Download"
            ""
            "**Windows** (10/11)"
            "- **Passthrify-$v-setup.exe**: installs Passthrify for your user (no admin needed),"
            "  with a Start menu entry and an uninstaller. Windows may show a SmartScreen warning because"
            "  the installer isn't code-signed: click **More info → Run anyway**."
            "- **Passthrify-$v.zip**: portable; unzip anywhere and run ``passthrify.exe``."
            ""
            "**Linux** (x86_64, glibc 2.39+ such as Ubuntu 24.04 / Fedora 40 or newer, PipeWire)"
            "- **Passthrify-$v-x86_64.AppImage**: one file; ``chmod +x`` it and run."
            "- **Passthrify-$v-linux-x86_64.tar.gz**: unpack anywhere and run ``Passthrify/passthrify``."
            "- Nix: ``nix run github:$env:GITHUB_REPOSITORY``."
            ""
            "Needs an NVIDIA GPU with its driver and an Elgato 4K-class capture card (on Linux any"
            "V4L2/UVC capture card). Close Elgato 4K Capture Utility / OBS first. Installed, portable,"
            "AppImage and tarball copies all update themselves."
            ""
            "### SHA-256"
          )
          foreach ($f in Get-ChildItem dist -Filter '*.sha256' | Sort-Object Name) {
            $hash, $name = (Get-Content $f.FullName -Raw).Trim() -split '\s+', 2
            $notes += "- ``$name``: ``$hash``"
          }
          if ($prev) {
            $notes += ""
            $notes += "**Full diff:** https://github.com/$env:GITHUB_REPOSITORY/compare/$prev...$tag"
          }
          $notes -join "`n" | Out-File -Encoding utf8NoBOM release-notes.md
          Get-Content release-notes.md
          $global:LASTEXITCODE = 0 # don't let the expected `git describe` miss fail the step

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Passthrify v${{ env.VERSION }}
          body_path: release-notes.md
          prerelease: ${{ env.KIND == 'dev' || contains(env.VERSION, '-') }}
          make_latest: ${{ env.KIND == 'release' && !contains(env.VERSION, '-') }}
          files: |
            dist/Passthrify-${{ env.VERSION }}-setup.exe
            dist/Passthrify-${{ env.VERSION }}-setup.exe.sha256
            dist/Passthrify-${{ env.VERSION }}.zip
            dist/Passthrify-${{ env.VERSION }}.zip.sha256
            dist/Passthrify-${{ env.VERSION }}-x86_64.AppImage
            dist/Passthrify-${{ env.VERSION }}-x86_64.AppImage.sha256
            dist/Passthrify-${{ env.VERSION }}-linux-x86_64.tar.gz
            dist/Passthrify-${{ env.VERSION }}-linux-x86_64.tar.gz.sha256
          fail_on_unmatched_files: true

      - name: Prune old dev builds
        if: env.KIND == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $old = gh release list --repo $env:GITHUB_REPOSITORY --limit 200 --json tagName,createdAt |
            ConvertFrom-Json |
            Where-Object { $_.tagName -match '-dev\.\d+$' } |
            Sort-Object { [datetime]$_.createdAt } -Descending |
            Select-Object -Skip ([int]$env:KEEP_DEV_BUILDS)
          foreach ($r in $old) {
            Write-Host "Deleting $($r.tagName)"
            gh release delete $r.tagName --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
          }
