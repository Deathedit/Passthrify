# Build + test on every push / PR.
# - Push to main: publishes a pre-release dev build (v<next>-dev.<commits>) for the Pre-release
#   update channel, keeping the newest few.
# - Push a tag like v0.2.0: publishes a release (a pre-release if the version has a suffix).
# Releases carry the packaged zip, its SHA-256 and patch notes from the commits since the
# previous tag.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # How many dev pre-releases to keep (older ones and their tags are deleted).
  KEEP_DEV_BUILDS: 5

jobs:
  build:
    runs-on: windows-latest
    env:
      # Baked into the exe (option_env!) so the in-app updater knows where to look.
      PASSTHRIFY_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for versions and patch notes

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # build.ps1 downloads FFmpeg 8.1 (LGPL shared) into third_party/ffmpeg when missing.
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-n8.1-lgpl-shared-${{ hashFiles('build.ps1') }}

      # kind: release (tag push), dev (main) or none (PRs, other branches).
      - name: Resolve version
        id: version
        env:
          IS_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          $kind = 'none'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $kind = 'release'
            if ($env:GITHUB_REF_NAME -ne "v$ver") {
              throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $ver - bump Cargo.toml first."
            }
          } elseif ($env:IS_MAIN -eq 'true') {
            $kind = 'dev'
            # N = commit count on main: rises with every commit and maps a build back to it.
            $n = (git rev-list --count HEAD).Trim()
            # A dev build must sort above the last release and below the next one.
            if ($ver -match '-') {
              $dev = "$ver.dev.$n"                          # 0.2.0-beta.1 -> 0.2.0-beta.1.dev.N
            } elseif (git tag -l "v$ver") {
              $p = $ver.Split('.')                          # 0.1.0 released -> 0.1.1-dev.N
              $dev = "$($p[0]).$($p[1]).$([int]$p[2] + 1)-dev.$n"
            } else {
              $dev = "$ver-dev.$n"                          # 0.2.0 unreleased -> 0.2.0-dev.N
            }
            # Stamp it into Cargo.toml so the exe reports it and build.ps1 names the zip after it.
            $toml = Get-Content Cargo.toml -Raw
            $toml = ([regex]'(?m)^version\s*=\s*"[^"]+"').Replace($toml, "version = `"$dev`"", 1)
            Set-Content Cargo.toml $toml -NoNewline -Encoding utf8NoBOM
            $ver = $dev
          }
          Write-Host "Version $ver ($kind)"
          "version=$ver" >> $env:GITHUB_OUTPUT
          "kind=$kind" >> $env:GITHUB_OUTPUT

      # The runner image normally ships Inno Setup 6; install it if this one doesn't.
      - name: Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }

      # Prerequisite checks, tests, release build, dist\Passthrify + the zip + the setup exe
      - name: Test, build and package
        run: ./build.ps1 -Zip -Installer

      - name: Checksum
        id: checksum
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          foreach ($file in "dist/Passthrify-$ver.zip", "dist/Passthrify-$ver-setup.exe") {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $file -Leaf)" | Out-File -Encoding ascii "$file.sha256"
          }
          "sha256=$((Get-FileHash "dist/Passthrify-$ver.zip" -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_OUTPUT
          "setup_sha256=$((Get-FileHash "dist/Passthrify-$ver-setup.exe" -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: Passthrify-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            dist/Passthrify-${{ steps.version.outputs.version }}.zip
            dist/Passthrify-${{ steps.version.outputs.version }}.zip.sha256
            dist/Passthrify-${{ steps.version.outputs.version }}-setup.exe
            dist/Passthrify-${{ steps.version.outputs.version }}-setup.exe.sha256
          if-no-files-found: error

      # ---- Release (tag pushes and main) --------------------------------------------------

      - name: Patch notes
        if: steps.version.outputs.kind != 'none'
        env:
          KIND: ${{ steps.version.outputs.kind }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          $tag = "v$env:VERSION"
          if ($env:KIND -eq 'release') {
            # Release notes cover everything since the previous real release, not the last dev build.
            $prev = git describe --tags --abbrev=0 --exclude '*-dev.*' "$tag^" 2>$null
            $head = $tag
          } else {
            $prev = git describe --tags --abbrev=0 --exclude $tag HEAD 2>$null
            $head = 'HEAD'
          }
          if ($LASTEXITCODE -ne 0) { $prev = $null } # no earlier tag
          $range = if ($prev) { "$prev..$head" } else { $head }
          $since = if ($prev) { "since $prev" } else { "(first release)" }

          # One bullet per commit subject; merge commits and release-bump commits are skipped.
          $changes = git -c i18n.logOutputEncoding=utf-8 log $range --no-merges --reverse --pretty=format:'%s' |
            Where-Object { $_ -and $_ -notmatch '^(Release|Bump version)\b' } |
            ForEach-Object { "- $_" }
          if (-not $changes) { $changes = @('- Maintenance release.') }

          $zip = "Passthrify-$env:VERSION.zip"
          $notes = @("## Passthrify $tag", "")
          if ($env:KIND -eq 'dev') {
            $notes += "Automatic pre-release build of ``$($env:GITHUB_SHA.Substring(0, 7))`` on main."
            $notes += "Less tested than stable releases; offered on the **Pre-release** update channel."
            $notes += ""
          }
          $notes += @(
            "### Changes $since"
            $changes
            ""
            "### Download"
            "- **Passthrify-$env:VERSION-setup.exe**: installs Passthrify for your user (no admin needed),"
            "  with a Start menu entry and an uninstaller. Windows may show a SmartScreen warning because"
            "  the installer isn't code-signed: click **More info → Run anyway**."
            "- **$zip**: portable; unzip anywhere and run ``passthrify.exe``."
            ""
            "Needs Windows 10/11, an NVIDIA GPU and an Elgato 4K-class capture card. Close Elgato 4K"
            "Capture Utility / OBS first. Installed and portable copies both update themselves."
            ""
            "SHA-256 (setup): ``${{ steps.checksum.outputs.setup_sha256 }}``"
            "SHA-256 (zip): ``${{ steps.checksum.outputs.sha256 }}``"
          )
          if ($prev) {
            $notes += ""
            $notes += "**Full diff:** https://github.com/$env:GITHUB_REPOSITORY/compare/$prev...$tag"
          }
          $notes -join "`n" | Out-File -Encoding utf8NoBOM release-notes.md
          Get-Content release-notes.md
          $global:LASTEXITCODE = 0 # don't let the expected `git describe` miss fail the step

      - name: Publish release
        if: steps.version.outputs.kind != 'none'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Passthrify v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ steps.version.outputs.kind == 'dev' || contains(steps.version.outputs.version, '-') }}
          make_latest: ${{ steps.version.outputs.kind == 'release' && !contains(steps.version.outputs.version, '-') }}
          files: |
            dist/Passthrify-${{ steps.version.outputs.version }}-setup.exe
            dist/Passthrify-${{ steps.version.outputs.version }}-setup.exe.sha256
            dist/Passthrify-${{ steps.version.outputs.version }}.zip
            dist/Passthrify-${{ steps.version.outputs.version }}.zip.sha256
          fail_on_unmatched_files: true

      - name: Prune old dev builds
        if: steps.version.outputs.kind == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $old = gh release list --repo $env:GITHUB_REPOSITORY --limit 200 --json tagName,createdAt |
            ConvertFrom-Json |
            Where-Object { $_.tagName -match '-dev\.\d+$' } |
            Sort-Object { [datetime]$_.createdAt } -Descending |
            Select-Object -Skip ([int]$env:KEEP_DEV_BUILDS)
          foreach ($r in $old) {
            Write-Host "Deleting $($r.tagName)"
            gh release delete $r.tagName --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
          }
