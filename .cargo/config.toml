[env]
# Prebuilt FFmpeg 8.1 LGPL shared build (BtbN). ffmpeg-sys-next reads this for headers + import libs,
# and build.rs copies the DLLs next to the built executable.
FFMPEG_DIR = { value = "third_party/ffmpeg", relative = true }
# libclang for ffmpeg-sys-next's bindgen step.
LIBCLANG_PATH = "C:\\Program Files\\LLVM\\bin"
# Update source baked into the exe (updater.rs). CI sets the same from github.repository;
# existing environment values win, so a fork's workflow points at the fork.
PASSTHRIFY_REPO = "Deathedit/Passthrify"
